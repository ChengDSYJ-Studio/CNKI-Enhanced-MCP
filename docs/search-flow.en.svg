<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Search workflow"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f95b5"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="#ffffff" stroke="#dbe6f6"/><rect x="24" y="40" width="150" height="210" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><circle cx="46" cy="64" r="13" fill="#0b2c63"/><text x="46" y="69" fill="#fff" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="111.0" y="69" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Planning</text><text x="99.0" y="108" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">required concepts</text><text x="99.0" y="134" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">AND between groups</text><text x="99.0" y="160" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">OR for synonyms</text><line x1="176" y1="145" x2="190" y2="145" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="194" y="40" width="210" height="210" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><circle cx="216" cy="64" r="13" fill="#0b2c63"/><text x="216" y="69" fill="#fff" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="311.0" y="69" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Field searches</text><rect x="206" y="90" width="186" height="26" rx="13" fill="#eaf2ff" stroke="#b9d1f7"/><text x="299.0" y="108" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">subject</text><rect x="206" y="124" width="186" height="26" rx="13" fill="#eaf2ff" stroke="#b9d1f7"/><text x="299.0" y="142" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">title</text><rect x="206" y="158" width="186" height="26" rx="13" fill="#eaf2ff" stroke="#b9d1f7"/><text x="299.0" y="176" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">keywords</text><text x="299.0" y="210" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">searched together each round</text><line x1="406" y1="145" x2="420" y2="145" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="424" y="40" width="160" height="210" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><circle cx="446" cy="64" r="13" fill="#0b2c63"/><text x="446" y="69" fill="#fff" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="516.0" y="69" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Dedup &amp; rank</text><text x="504.0" y="108" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">merge duplicates</text><text x="504.0" y="134" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">initial ranking</text><text x="504.0" y="160" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">choose papers</text><text x="504.0" y="186" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">for detail pages</text><line x1="586" y1="145" x2="600" y2="145" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="604" y="40" width="250" height="210" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><circle cx="626" cy="64" r="13" fill="#0b2c63"/><text x="626" y="69" fill="#fff" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="741.0" y="69" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Detail pages</text><rect x="616" y="90" width="226" height="26" rx="13" fill="#eaf2ff" stroke="#b9d1f7"/><text x="729.0" y="108" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">abstract, keywords, DOI</text><rect x="616" y="124" width="226" height="26" rx="13" fill="#eaf2ff" stroke="#b9d1f7"/><text x="729.0" y="142" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">journal indexing, impact</text><rect x="616" y="158" width="226" height="26" rx="13" fill="#eaf2ff" stroke="#b9d1f7"/><text x="729.0" y="176" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">render when needed</text><text x="729.0" y="210" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">one failure does not stop others</text><line x1="856" y1="145" x2="870" y2="145" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="874" y="40" width="140" height="210" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><circle cx="896" cy="64" r="13" fill="#0b2c63"/><text x="896" y="69" fill="#fff" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="956.0" y="69" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Follow-up</text><text x="944.0" y="108" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">shared keywords</text><text x="944.0" y="134" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">up to 2 searches</text><text x="944.0" y="160" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">concepts kept</text><line x1="1016" y1="145" x2="1030" y2="145" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="1034" y="40" width="142" height="210" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><circle cx="1056" cy="64" r="13" fill="#0b2c63"/><text x="1056" y="69" fill="#fff" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="1117.0" y="69" fill="#1d5fd1" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Ranking</text><text x="1105.0" y="108" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">relevance</text><text x="1105.0" y="134" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">source quality</text><text x="1105.0" y="160" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">selection</text><rect x="24" y="272" width="1152" height="46" rx="10" fill="#0b2c63" stroke="#0b2c63" stroke-width="1.5"/><text x="600" y="301" fill="#fff" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Every request goes through one limiter and starts at a fixed interval</text><rect x="24" y="330" width="1152" height="46" rx="10" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><text x="600" y="359" fill="#4f6481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">On a verification or login page, requests pause; the user handles it in the opened page and the task continues</text></svg>
