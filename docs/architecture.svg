<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="CNKI Enhanced MCP 2.1 架构"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f95b5"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="749" rx="16" fill="#ffffff" stroke="#dbe6f6"/><rect x="40" y="30" width="1120" height="70" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><text x="600" y="62" fill="#1d5fd1" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="700" text-anchor="middle">MCP 客户端（可同时连接多个）</text><text x="600" y="86" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Claude、Codex、Cursor、VS Code、Gemini CLI 等；每个客户端启动一个 stdio 桥接</text><line x1="600" y1="100" x2="600" y2="128" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="130" width="1120" height="128" rx="12" fill="#ffffff" stroke="#1d5fd1" stroke-width="2"/><text x="600" y="160" fill="#1d5fd1" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="700" text-anchor="middle">共享 MCP 后端（9 个工具）</text><text x="600" y="184" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">每个数据目录一个后端进程，经本机回环地址和随机密钥连接；断开只取消该客户端的任务，最后一个客户端断开后退出</text><rect x="214" y="206" width="54" height="28" rx="14" fill="#eaf2ff" stroke="#b9d1f7"/><text x="241" y="225" fill="#1d5fd1" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" text-anchor="middle">login</text><rect x="278" y="206" width="63" height="28" rx="14" fill="#eaf2ff" stroke="#b9d1f7"/><text x="309" y="225" fill="#1d5fd1" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" text-anchor="middle">status</text><rect x="350" y="206" width="63" height="28" rx="14" fill="#eaf2ff" stroke="#b9d1f7"/><text x="382" y="225" fill="#1d5fd1" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" text-anchor="middle">search</text><rect x="423" y="206" width="71" height="28" rx="14" fill="#eaf2ff" stroke="#b9d1f7"/><text x="459" y="225" fill="#1d5fd1" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" text-anchor="middle">results</text><rect x="504" y="206" width="114" height="28" rx="14" fill="#eaf2ff" stroke="#b9d1f7"/><text x="561" y="225" fill="#1d5fd1" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" text-anchor="middle">get_metadata</text><rect x="628" y="206" width="45" height="28" rx="14" fill="#eaf2ff" stroke="#b9d1f7"/><text x="651" y="225" fill="#1d5fd1" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" text-anchor="middle">read</text><rect x="684" y="206" width="80" height="28" rx="14" fill="#eaf2ff" stroke="#b9d1f7"/><text x="724" y="225" fill="#1d5fd1" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" text-anchor="middle">download</text><rect x="774" y="206" width="63" height="28" rx="14" fill="#eaf2ff" stroke="#b9d1f7"/><text x="805" y="225" fill="#1d5fd1" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" text-anchor="middle">export</text><rect x="846" y="206" width="140" height="28" rx="14" fill="#eaf2ff" stroke="#b9d1f7"/><text x="916" y="225" fill="#1d5fd1" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" text-anchor="middle">link_references</text><line x1="230" y1="258" x2="230" y2="288" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><line x1="600" y1="258" x2="600" y2="288" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><line x1="970" y1="258" x2="970" y2="288" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="290" width="360" height="110" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><text x="220" y="324" fill="#1d5fd1" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" text-anchor="middle">任务管理</text><text x="220" y="352" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">请求与时间预算、检查点</text><text x="220" y="374" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">results(continue=true) 续跑</text><rect x="420" y="290" width="360" height="110" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><text x="600" y="324" fill="#1d5fd1" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" text-anchor="middle">检索流程</text><text x="600" y="352" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">概念规划、多通道检索、读取详情</text><text x="600" y="374" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">关键词反馈补检、排序筛选</text><rect x="800" y="290" width="360" height="110" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><text x="980" y="324" fill="#1d5fd1" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" text-anchor="middle">本地存储（SQLite）</text><text x="980" y="352" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">cnki.sqlite（WAL）：论文、期刊、</text><text x="980" y="374" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">检索、正文快照、文件、任务</text><line x1="600" y1="400" x2="600" y2="428" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="430" width="1120" height="86" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><text x="600" y="462" fill="#1d5fd1" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" text-anchor="middle">站点访问</text><text x="600" y="490" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">检索模板、每页 50 条的列表、详情页、期刊页、HTML 阅读、下载；验证或登录交给用户</text><line x1="600" y1="516" x2="600" y2="544" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="546" width="1120" height="76" rx="12" fill="#0b2c63" stroke="#0b2c63" stroke-width="1.5"/><text x="600" y="578" fill="#ffffff" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="700" text-anchor="middle">请求限速</text><text x="600" y="604" fill="#8cc8ff" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">请求开始至少间隔 500 ms，最多 6 个在途；429/503 时间隔加倍；人工验证期间暂停</text><line x1="600" y1="622" x2="600" y2="650" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="652" width="740" height="70" rx="12" fill="#fff" stroke="#cfdcf0" stroke-width="1.5"/><text x="410" y="682" fill="#1d5fd1" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" text-anchor="middle">专用浏览器（Chrome / Edge / Chromium）</text><text x="410" y="706" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">独立配置目录保存登录；最小化运行，只在登录和知网要求验证时显示窗口</text><line x1="780" y1="687" x2="836" y2="687" stroke="#7f95b5" stroke-width="2" marker-end="url(#a)"/><rect x="840" y="652" width="320" height="70" rx="12" fill="#eaf2ff" stroke="#b9d1f7" stroke-width="1.5"/><text x="1000" y="682" fill="#1d5fd1" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700" text-anchor="middle">中国知网</text><text x="1000" y="706" fill="#4f6481" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" text-anchor="middle">kns.cnki.net、navi.cnki.net</text></svg>
