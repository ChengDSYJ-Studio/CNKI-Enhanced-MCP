[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cnki-enhanced-mcp"
version = "1.0.0"
description = "A cross-platform Playwright MCP for intelligent CNKI search, authorized HTML reading, citation export, downloads, and reference linking."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "CNKI-Enhanced-MCP contributors" }]
dependencies = [
  "fastmcp>=2.12,<4",
  "playwright>=1.50,<2",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
cnki-enhanced-mcp = "cnki_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cnki_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
